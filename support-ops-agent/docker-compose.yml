services:
  postgres:
    image: postgres:15-alpine
    container_name: conduit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conduit_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: conduit-mcp
    ports:
      - "8001:8001"
    env_file:
      - ./.env

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: conduit-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/conduit_db
      - MCP_SERVER_URL=http://mcp-server:8001/mcp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conduit-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}

volumes:
  postgres_data:
