name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            support-ops-agent/agent/requirements.txt
            support-ops-agent/backend/requirements.txt
            support-ops-agent/mcp-server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r support-ops-agent/agent/requirements.txt
          python -m pip install -r support-ops-agent/backend/requirements.txt
          python -m pip install -r support-ops-agent/mcp-server/requirements.txt

      - name: Check Python dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            support-ops-agent/agent \
            support-ops-agent/backend \
            support-ops-agent/mcp-server

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: support-ops-agent/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: support-ops-agent/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: support-ops-agent/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: support-ops-agent/frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

  docker-builds:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP server image
        uses: docker/build-push-action@v6
        with:
          context: support-ops-agent/mcp-server
          file: support-ops-agent/mcp-server/Dockerfile
          push: false
          tags: conduit-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: support-ops-agent
          file: support-ops-agent/backend/Dockerfile
          push: false
          tags: conduit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: support-ops-agent/frontend
          file: support-ops-agent/frontend/Dockerfile
          push: false
          tags: conduit-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max